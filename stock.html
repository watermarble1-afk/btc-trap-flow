<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>가온전선 · STOCK SIGNAL LAB</title>
<script src="https://unpkg.com/lightweight-charts@4.2.0/dist/lightweight-charts.standalone.production.js"></script>
<style>
:root{--bg:#070a10;--p:#0e1420;--line:#20293a;--txt:#e9eef7;--mut:#8d99ad;--blue:#4f8cff;--red:#ff4f64;--cyan:#35d7e5}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,sans-serif}.wrap{padding:12px}
.top{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap}h1{font-size:18px;margin:0}.mut{color:var(--mut);font-size:10px}
.pill,.btn{border:1px solid var(--line);background:#131b29;color:var(--txt);padding:7px 10px;border-radius:7px}.btn{cursor:pointer}
.cards{display:grid;grid-template-columns:repeat(5,1fr);gap:7px;margin:10px 0}.card,.panel{background:var(--p);border:1px solid var(--line);border-radius:10px;padding:9px}.lbl{font-size:9px;color:var(--mut)}.val{font-size:15px;font-weight:800;margin-top:3px}
.grid{display:grid;grid-template-columns:minmax(0,2fr) 350px;gap:9px}.tools{position:relative;margin-bottom:7px}.ind{display:none;position:absolute;z-index:20;top:38px;left:0;width:320px;background:#0d1420;border:1px solid #30405a;border-radius:9px;padding:10px}.ind.open{display:block}
.ind input,.ind select{background:#111a28;color:white;border:1px solid #30405a;padding:6px;border-radius:5px}.tag{display:inline-block;border:1px solid #30405a;padding:4px 7px;border-radius:20px;font-size:10px;margin:5px 3px 0 0;cursor:pointer}
#chart{height:680px}.legend{font-size:10px;color:var(--mut);display:flex;gap:12px;flex-wrap:wrap;margin-top:6px}.list{max-height:520px;overflow:auto}.item{display:grid;grid-template-columns:80px 1fr 80px;gap:5px;border-bottom:1px solid #1b2433;padding:7px 0;font-size:10px}
.blue{color:var(--blue)}.red{color:var(--red)}.cyan{color:var(--cyan)}
@media(max-width:850px){.cards{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}#chart{height:520px}}
</style>
<style>
.hoverbar{display:flex;gap:12px;flex-wrap:wrap;align-items:center;min-height:28px;margin:5px 0 7px;padding:5px 8px;background:#0b111b;border:1px solid #1e293a;border-radius:7px;font-size:10px;color:#aab5c7}
.hoverbar b{font-size:11px}.pctUp{color:#4f8cff}.pctDn{color:#ff4f64}.pctFlat{color:#c7d0dd}
</style>
</head><body><div class="wrap">
<div id="apierr" style="display:none;margin-bottom:8px;padding:9px;border:1px solid #ff4f64;border-radius:8px;color:#ff8290;font-size:11px;white-space:pre-wrap"></div><div class="top"><div><h1>가온전선 <span style="color:#f1c75b">000500</span> · STOCK SIGNAL LAB v1.1</h1><div class="mut">일봉 과거 신호 연구판</div></div><div class="pill" id="state">DATA LOADING…</div></div>
<div class="cards"><div class="card"><div class="lbl">최근 종가</div><div class="val" id="last">—</div></div><div class="card"><div class="lbl">데이터</div><div class="val" id="bars">—</div></div><div class="card"><div class="lbl">LONG</div><div class="val blue" id="lc">—</div></div><div class="card"><div class="lbl">SHORT</div><div class="val red" id="sc">—</div></div><div class="card"><div class="lbl">상태</div><div class="val" id="pos">FLAT</div></div></div>
<div class="grid"><section class="panel"><div class="tools"><div id="tfbar" style="display:flex;gap:5px;flex-wrap:wrap;margin-bottom:6px">
<button class="btn tf" data-tf="1M">1분</button><button class="btn tf" data-tf="5M">5분</button><button class="btn tf" data-tf="15M">15분</button><button class="btn tf" data-tf="30M">30분</button><button class="btn tf" data-tf="60M">60분</button><button class="btn tf" data-tf="1D">일</button><button class="btn tf" data-tf="1W">주</button><button class="btn tf" data-tf="1MO">월</button></div><button class="btn" id="indBtn">⚙ 지표 설정</button><div class="ind" id="ind">
<div><input id="len" type="number" min="2" max="500" value="20" style="width:75px"> <select id="typ"><option>SMA</option><option>EMA</option></select> <input id="maColor" type="color" value="#f1c75b" title="선 색상" style="width:42px;height:31px;padding:2px;vertical-align:middle"> <button class="btn" id="add">+ 추가</button></div>
<div id="tags"></div><div style="margin-top:9px"><label><input id="volC" type="checkbox" checked> 거래량</label></div><div class="mut" style="margin-top:7px">5·20·60·120·240 등 직접 입력 · 클릭한 이평선은 ×로 삭제</div></div></div>
<div class="hoverbar" id="hoverbar"><span>봉에 마우스를 올리면 등락률이 표시됩니다.</span></div><div id="chart"></div><div class="legend"><span class="blue"><b>L</b></span><span class="red"><b>S</b></span><span class="cyan"><b>RETEST</b></span><span><b>X</b> 포지션 정리</span></div></section>
<aside><div class="panel"><b>과거 신호</b><div class="list" id="list"></div></div></aside></div></div>
<script>
const $=x=>document.getElementById(x), won=n=>Math.round(n||0).toLocaleString('ko-KR')+'원';
let chart,candle,volume,rows=[],ma=[],maSeries=[];
function ATR(a,i,n=14){let s=0,k=0;for(let j=Math.max(1,i-n+1);j<=i;j++){let x=a[j],p=a[j-1].close;s+=Math.max(x.high-x.low,Math.abs(x.high-p),Math.abs(x.low-p));k++}return k?s/k:0}
function signals(a){let out=[],pos=null,bo=null;for(let i=20;i<a.length;i++){let x=a[i],p=a.slice(i-10,i),hi=Math.max(...p.map(z=>z.high)),lo=Math.min(...p.map(z=>z.low)),A=ATR(a,i),av=a.slice(i-20,i).reduce((q,z)=>q+z.volume,0)/20;
let L=x.low<lo&&x.close>lo&&x.close>x.low+(x.high-x.low)*.55,S=x.high>hi&&x.close<hi&&x.close<x.low+(x.high-x.low)*.45;
if(L){if(pos?.side==='SHORT')out.push({time:x.time,type:'EXIT',side:'SHORT',price:x.close});out.push({time:x.time,type:'LONG',price:x.close});pos={side:'LONG',entry:x.close,best:x.close,A}}
else if(S){if(pos?.side==='LONG')out.push({time:x.time,type:'EXIT',side:'LONG',price:x.close});out.push({time:x.time,type:'SHORT',price:x.close});pos={side:'SHORT',entry:x.close,best:x.close,A}}
if(x.close>hi&&x.volume>av*1.35)bo={side:'L',level:hi,end:i+8,used:false};if(x.close<lo&&x.volume>av*1.35)bo={side:'S',level:lo,end:i+8,used:false};
if(bo&&!bo.used&&i<=bo.end){if(bo.side==='L'&&x.low<=bo.level*1.012&&x.close>bo.level){out.push({time:x.time,type:'RETEST L',price:x.close});bo.used=true}if(bo.side==='S'&&x.high>=bo.level*.988&&x.close<bo.level){out.push({time:x.time,type:'RETEST S',price:x.close});bo.used=true}}
if(pos){if(pos.side==='LONG'){pos.best=Math.max(pos.best,x.high);if(pos.best-pos.entry>=.8*pos.A&&pos.best-x.close>=1.15*pos.A){out.push({time:x.time,type:'EXIT',side:'LONG',price:x.close});pos=null}}else{pos.best=Math.min(pos.best,x.low);if(pos.entry-pos.best>=.8*pos.A&&x.close-pos.best>=1.15*pos.A){out.push({time:x.time,type:'EXIT',side:'SHORT',price:x.close});pos=null}}}}
return {out,pos}}
function calcMA(n,t){let z=[],e=null,k=2/(n+1);for(let i=0;i<rows.length;i++){let v;if(t==='EMA'){e=e==null?rows[i].close:rows[i].close*k+e*(1-k);if(i>=n-1)v=e}else if(i>=n-1)v=rows.slice(i-n+1,i+1).reduce((q,x)=>q+x.close,0)/n;if(v!=null)z.push({time:rows[i].time,value:v})}return z}
function drawMA(){maSeries.forEach(x=>{try{chart.removeSeries(x)}catch(e){}});maSeries=[];ma.forEach(m=>{let z=chart.addLineSeries({lineWidth:2,color:m.c||'#f1c75b',priceLineVisible:false,lastValueVisible:false,title:m.t+m.n});z.setData(calcMA(m.n,m.t));maSeries.push(z)});$('tags').innerHTML=ma.map((m,i)=>`<span class="tag" data-i="${i}" style="border-color:${m.c||'#f1c75b'};color:${m.c||'#f1c75b'}">${m.t}${m.n} ×</span>`).join('');document.querySelectorAll('[data-i]').forEach(x=>x.onclick=()=>{ma.splice(+x.dataset.i,1);save();drawMA()})}
function save(){localStorage.setItem('stock-ma-000500',JSON.stringify(ma))}

let curTF='1D';
function aggregate(a,mode){
 let m=new Map();
 for(const x of a){let d=new Date(x.time*1000),key;
  if(mode==='1W'){let z=new Date(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),d.getUTCDate()));let day=(z.getUTCDay()+6)%7;z.setUTCDate(z.getUTCDate()-day);key=Math.floor(z.getTime()/1000)}
  else key=Math.floor(Date.UTC(d.getUTCFullYear(),d.getUTCMonth(),1)/1000);
  if(!m.has(key))m.set(key,{time:key,open:x.open,high:x.high,low:x.low,close:x.close,volume:x.volume});
  else{let q=m.get(key);q.high=Math.max(q.high,x.high);q.low=Math.min(q.low,x.low);q.close=x.close;q.volume+=x.volume}
 }return [...m.values()].sort((a,b)=>a.time-b.time)
}
async function init(tf=curTF){try{
 curTF=tf; $('state').textContent='DATA LOADING…';$('apierr').style.display='none';

let apiTF=(tf==='1W'||tf==='1MO')?'1D':tf;let r=await fetch('/api/stock/gaon?tf='+encodeURIComponent(apiTF)+'&v=48',{cache:'no-store'});if(!r.ok)throw Error('API '+r.status);let j=await r.json();rows=j.rows||[];if(tf==='1W'||tf==='1MO')rows=aggregate(rows,tf);if(!rows.length)throw Error(j.error||'주가 데이터 0건');
if(!window.LightweightCharts)throw Error('차트 라이브러리 로딩 실패');
$('state').textContent='● '+tf+' · '+(j.source||'DATA');$('state').style.color='#35d7e5';$('last').textContent=won(rows.at(-1).close);$('bars').textContent=rows.length+'봉';
if(chart){try{chart.remove()}catch(e){};chart=null;candle=null;volume=null;maSeries=[]}$('chart').innerHTML='';chart=LightweightCharts.createChart($('chart'),{layout:{background:{color:'#0a0f18'},textColor:'#8d99ad'},grid:{vertLines:{color:'#151d2a'},horzLines:{color:'#151d2a'}},rightPriceScale:{borderColor:'#253044'},timeScale:{borderColor:'#253044'}});
candle=chart.addCandlestickSeries({upColor:'#2fd58b',downColor:'#ff5c70',borderVisible:false,wickUpColor:'#2fd58b',wickDownColor:'#ff5c70'});volume=chart.addHistogramSeries({priceFormat:{type:'volume'},priceScaleId:'vol'});chart.priceScale('vol').applyOptions({scaleMargins:{top:.82,bottom:0}});
candle.setData(rows);
function pctClass(v){return v>0?'pctUp':v<0?'pctDn':'pctFlat'}
function showBar(i){
 if(i<0||i>=rows.length)return;let x=rows[i],prev=i>0?rows[i-1].close:x.open;
 let day=(x.close/prev-1)*100, body=(x.close/x.open-1)*100, range=(x.high/x.low-1)*100;
 let d=new Date(x.time*1000).toLocaleDateString('ko-KR');
 $('hoverbar').innerHTML=`<b>${d}</b><span>O ${won(x.open)}</span><span>H ${won(x.high)}</span><span>L ${won(x.low)}</span><span>C ${won(x.close)}</span><b class="${pctClass(day)}">하루 ${day>=0?'+':''}${day.toFixed(2)}%</b><b class="${pctClass(body)}">봉 ${body>=0?'+':''}${body.toFixed(2)}%</b><span>고저폭 ${range.toFixed(2)}%</span>`;
}
showBar(rows.length-1);
chart.subscribeCrosshairMove(param=>{if(!param||!param.time)return;let i=rows.findIndex(x=>x.time===param.time);if(i>=0)showBar(i)});
volume.setData(rows.map(x=>({time:x.time,value:x.volume,color:x.close>=x.open?'rgba(47,213,139,.25)':'rgba(255,92,112,.25)'})));
let q=signals(rows),sg=q.out;let mk=sg.map(s=>({time:s.time,position:s.type==='LONG'||s.type==='RETEST L'?'belowBar':s.type==='SHORT'||s.type==='RETEST S'?'aboveBar':s.side==='LONG'?'aboveBar':'belowBar',color:s.type==='LONG'?'#4f8cff':s.type==='SHORT'?'#ff4f64':s.type.startsWith('RETEST')?'#35d7e5':'#d7dee9',shape:s.type==='LONG'?'arrowUp':s.type==='SHORT'?'arrowDown':'circle',text:s.type==='EXIT'?'X':s.type==='LONG'?'L':s.type==='SHORT'?'S':s.type}));candle.setMarkers(mk.sort((a,b)=>a.time-b.time));chart.timeScale().fitContent();
$('lc').textContent=sg.filter(x=>x.type==='LONG').length;$('sc').textContent=sg.filter(x=>x.type==='SHORT').length;$('pos').textContent=q.pos?.side||'FLAT';
$('list').innerHTML=sg.slice().reverse().slice(0,80).map(s=>`<div class="item"><span>${new Date(s.time*1000).toLocaleDateString('ko-KR')}</span><b class="${s.type==='LONG'?'blue':s.type==='SHORT'?'red':s.type.startsWith('RETEST')?'cyan':''}">${s.type==='EXIT'?'X '+s.side:s.type}</b><span>${won(s.price)}</span></div>`).join('');
try{ma=JSON.parse(localStorage.getItem('stock-ma-000500')||'[]')}catch(e){}drawMA();new ResizeObserver(()=>chart.applyOptions({width:$('chart').clientWidth})).observe($('chart'));
}catch(e){$('state').textContent='ERROR';$('state').style.color='#ff4f64';$('apierr').style.display='block';$('apierr').textContent='주가 데이터 오류: '+e.message;$('list').innerHTML='<div class="mut" style="padding:10px">'+e.message+'</div>';console.error(e)}}
$('indBtn').onclick=()=>$('ind').classList.toggle('open');$('add').onclick=()=>{let n=Math.max(2,Math.min(500,+$('len').value||20)),t=$('typ').value;let c=$('maColor').value;if(!ma.some(x=>x.n===n&&x.t===t))ma.push({n,t,c});save();drawMA()};$('volC').onchange=()=>{if(volume)volume.applyOptions({visible:$('volC').checked})};
document.querySelectorAll('.tf').forEach(x=>x.onclick=()=>init(x.dataset.tf));init('1D');
</script></body></html>
